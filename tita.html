<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anatomia do Titã — Tap Titans 2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0f16;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 10px 32px 10px;
      overflow-x: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
      background: rgba(25, 34, 45, 0.92);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #2b394a;
      max-width: 440px;
      width: 100%;
    }
    .header h1 {
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      color: #f5a623;
    }
    .header p {
      color: #8fa0b5;
      font-size: 11px;
      margin-top: 3px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* FILA DOS 7 TITÃS (SPAWN SEQUENCE) */
    .spawn-queue {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
    }
    .spawn-block {
      background: #161f2c;
      border: 1px solid #2b394a;
      color: #c4d1de;
      padding: 5px 2px;
      border-radius: 7px;
      text-align: center;
      font-size: 9.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      user-select: none;
    }
    .spawn-num {
      font-size: 8px;
      color: #6c7e93;
      font-weight: 800;
    }
    .spawn-block.dead {
      background: #0d1117;
      border-color: #1c2530;
      color: #4a5568;
      opacity: 0.5;
      text-decoration: line-through;
    }
    .spawn-block.current {
      background: rgba(245, 166, 35, 0.16);
      border: 1.5px solid #f5a623;
      color: #f5a623;
      box-shadow: 0 0 10px rgba(245, 166, 35, 0.2);
    }
    .spawn-block.current .spawn-num {
      color: #f5a623;
    }

    /* BARRA DE VIDA GLOBAL DO TITÃ (COM COR DINÂMICA) */
    .card-global {
      background: rgba(25, 34, 45, 0.92);
      border: 1px solid #2b394a;
      border-radius: 10px;
      padding: 11px 14px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #121921;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* DESEMPENHO E INFO DO TIER */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .stat-box {
      background: rgba(18, 25, 33, 0.85);
      border: 1px solid #2b394a;
      border-radius: 8px;
      padding: 7px 4px;
      text-align: center;
    }
    .stat-label {
      font-size: 8.5px;
      color: #8fa0b5;
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-value {
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
    }

    /* BUFF E DEBUFFS */
    .buffs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .badge-info {
      background: rgba(25, 34, 45, 0.9);
      border: 1px solid #2b394a;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 10.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* LAYOUT ANATÔMICO COMPACTO (3 COLUNAS DE BLOCOS 1:1 MENORES) */
    .titam-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      background: rgba(16, 22, 31, 0.75);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #1f2a38;
      max-width: 350px;
      width: 100%;
      margin: 0 auto;
    }

    .part-unit {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slot-ombro-dir { grid-column: 1; grid-row: 1; }
    .slot-cabeca    { grid-column: 2; grid-row: 1; }
    .slot-ombro-esq { grid-column: 3; grid-row: 1; }

    .slot-mao-dir   { grid-column: 1; grid-row: 2; }
    .slot-peito     { grid-column: 2; grid-row: 2; }
    .slot-mao-esq   { grid-column: 3; grid-row: 2; }

    .pernas-container {
      grid-column: span 3;
      grid-row: 3;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .pernas-container .part-unit {
      width: calc((100% - 16px) / 3);
    }

    .unit-top-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px;
      height: 20px;
    }

    .tag-rect {
      background: #141c26;
      border: 1px solid #263344;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      color: #6c7e93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-rect.decay {
      background: rgba(136, 84, 208, 0.28);
      border-color: #a55eea;
      color: #e2c6ff;
      box-shadow: 0 0 6px rgba(165, 94, 234, 0.3);
    }
    .tag-rect.no-attack {
      background: rgba(235, 77, 75, 0.2);
      border-color: #ff5252;
      color: #ff8080;
    }
    .tag-rect.spinal {
      background: rgba(245, 166, 35, 0.22);
      border-color: #f5a623;
      color: #ffc048;
    }
    .tag-rect.dead {
      background: #0f141c;
      border-color: #1f2937;
      color: #4b5563;
    }

    .pct-box {
      background: #182230;
      border: 1px solid #2e3d52;
      border-radius: 5px;
      padding: 0 5px;
      min-width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
      color: #ffffff;
    }

    /* TANQUE 1:1 */
    .part-tank {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #101620;
      border: 1.5px solid #263344;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.65);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .part-tank.tank-decay {
      border-color: #a55eea;
      box-shadow: 0 0 10px rgba(165, 94, 234, 0.35), inset 0 0 12px rgba(165, 94, 234, 0.2);
    }
    .part-tank.tank-no-attack {
      border-color: rgba(255, 82, 82, 0.75);
    }
    .part-tank.tank-spinal {
      border-color: rgba(245, 166, 35, 0.85);
      box-shadow: 0 0 10px rgba(245, 166, 35, 0.2);
    }
    .part-tank.tank-dead {
      opacity: 0.38;
      border-color: #1c2530;
    }

    .liquid-level {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
      z-index: 1;
    }

    .liquid-level::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }

    .liquid-armor {
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.55) 0%, rgba(0, 114, 255, 0.22) 100%);
    }
    .liquid-body {
      background: linear-gradient(180deg, rgba(46, 204, 113, 0.55) 0%, rgba(29, 131, 72, 0.22) 100%);
    }
    .liquid-decay {
      background: linear-gradient(180deg, rgba(165, 94, 234, 0.65) 0%, rgba(108, 42, 173, 0.25) 100%);
    }

    .tank-overlay-top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 7px 8px;
      width: 100%;
    }

    .tank-icon {
      font-size: 13px;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.7));
    }

    .tank-hp {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      letter-spacing: -0.3px;
    }

    .voltar-link {
      display: inline-block;
      text-align: center;
      margin-top: 6px;
      color: #5865F2;
      font-size: 11.5px;
      text-decoration: none;
      font-weight: 700;
    }
    .voltar-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 380px) {
      .titam-grid {
        gap: 8px 6px;
        padding: 9px;
      }
      .pernas-container {
        gap: 6px;
      }
      .pernas-container .part-unit {
        width: calc((100% - 12px) / 3);
      }
      .unit-top-bar {
        height: 18px;
        gap: 3px;
      }
      .tag-rect {
        font-size: 7.5px;
        padding: 0 2px;
      }
      .pct-box {
        font-size: 8.5px;
        min-width: 26px;
        padding: 0 3px;
      }
      .tank-overlay-top {
        padding: 5px 6px;
      }
      .tank-icon {
        font-size: 11px;
      }
      .tank-hp {
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="titulo-tita">Anatomia do Titã</h1>
    <p id="subtitulo-status">Sincronizando dados da Raid em tempo real...</p>
  </div>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Tier / Nível</div>
        <div id="txt-tier-nivel" class="stat-value" style="color: #50e3c2;">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Titã Atual</div>
        <div id="txt-nome-tita" class="stat-value" style="color: #f5a623;">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Moral do Clã</div>
        <div id="txt-moral" class="stat-value" style="color: #4cd964;">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Progresso</div>
        <div id="txt-progresso-fila" class="stat-value" style="color: #c4d1de;">-- / 7</div>
      </div>
    </div>

    <div id="fila-titans" class="spawn-queue"></div>

    <div class="buffs-row">
      <div class="badge-info">
        <span style="color: #8fa0b5;">✨ Buff:</span>
        <strong id="txt-buff-area" style="color: #4cd964;">Nenhum</strong>
      </div>
      <div class="badge-info">
        <span style="color: #8fa0b5;">⚠️ Debuff:</span>
        <strong id="txt-debuff-tita" style="color: #ff8080;">Nenhum</strong>
      </div>
    </div>

    <!-- Vida Global com cor espectral dinâmica -->
    <div class="card-global">
      <div class="card-title">
        <span>Vida do Titã</span>
        <span id="txt-vida-global">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar-bg">
        <div id="bar-vida-global" class="progress-bar-fill"></div>
      </div>
    </div>

    <div id="grid-titam" class="titam-grid">
      <div style="color: #8fa0b5; font-size: 11px; grid-column: span 3; text-align: center; padding: 16px;">Carregando tanques de HP do Titã...</div>
    </div>

    <a href="painel_raid.html" class="voltar-link">← Voltar para o Painel de Ataques Ao Vivo</a>
  </div>

  <script>
    const SUPABASE_URL = "https://hqhirsnowapylfwhvduf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxaGlyc25vd2FweWxmd2h2ZHVmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjkzNTkxOCwiZXhwIjoyMTA4NTExOTE4fQ.sAZeXN1XFKDh0gVGBomanuHM6GkcEto8AmxZzNRehpI";
    const cofre = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const mapaTitansPorId = {
      "Enemy1": "Lojak",
      "Enemy2": "Takedar",
      "Enemy3": "Jukk",
      "Enemy4": "Sterl",
      "Enemy5": "Mohaca",
      "Enemy6": "Terro",
      "Enemy7": "Klonk",
      "Enemy8": "Priker"
    };

    const mapaSlotsAnatomicos = {
      "ArmUpperRight": "slot-ombro-dir",
      "Head":          "slot-cabeca",
      "ArmUpperLeft":  "slot-ombro-esq",
      "HandRight":     "slot-mao-dir",
      "ChestUpper":    "slot-peito",
      "HandLeft":      "slot-mao-esq",
      "LegUpperRight": "slot-perna-dir",
      "LegUpperLeft":  "slot-perna-esq"
    };

    function formatarNumero(num) {
      const n = Number(num || 0);
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(0) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
      return n.toLocaleString("pt-BR");
    }

    // Retorna a cor exata do espectro (do verde ao vermelho via amarelo/laranja) baseada na porcentagem
    function obterCorEspectral(pct) {
      const p = Math.max(0, Math.min(100, pct));
      let r, g, b;
      if (p > 50) {
        // De Verde (100%) para Amarelo (50%)
        const t = (p - 50) / 50;
        r = Math.round(230 * (1 - t) + 120 * t);
        g = Math.round(190 * (1 - t) + 200 * t);
        b = Math.round(50 * (1 - t) + 60 * t);
      } else {
        // De Amarelo (50%) para Vermelho (0%)
        const t = p / 50;
        r = Math.round(235 * (1 - t) + 230 * t);
        g = Math.round(80 * (1 - t) + 190 * t);
        b = Math.round(50 * (1 - t) + 60 * t);
      }
      return `rgb(${r}, ${g}, ${b})`;
    }

    function extrairObjeto(dadosBrutos) {
      if (!dadosBrutos) return null;
      let obj = dadosBrutos;
      if (typeof obj === "string") {
        try { obj = JSON.parse(obj); } catch (e) { return null; }
      }
      if (Array.isArray(obj) && obj.length > 0) {
        obj = obj[0];
      }
      return obj;
    }

    function descobrirIndiceNaFila(spawnSeq, dadosSub, raidStateAoVivo, historicoEventos) {
      if (!spawnSeq || spawnSeq.length === 0) return 0;

      const raidObj = dadosSub.raid || dadosSub;
      const idxExplicito = raidStateAoVivo?.titan_index ?? raidObj?.titan_index ?? dadosSub?.titan_index;
      if (typeof idxExplicito === "number" && idxExplicito >= 0 && idxExplicito < spawnSeq.length) {
        return idxExplicito;
      }

      let cursor = 0;
      const eventosOrdenados = [...(historicoEventos || [])].reverse();
      let ultimoEnemyVisto = null;

      for (const ev of eventosOrdenados) {
        const d = extrairObjeto(ev.dados);
        const rs = d?.raid_state?.current || d?.raid_state;
        if (rs && rs.enemy_id) {
          const nomeChefe = rs.enemy_name || mapaTitansPorId[rs.enemy_id] || rs.enemy_id;
          if (!ultimoEnemyVisto) {
            const primeiroMatch = spawnSeq.indexOf(nomeChefe);
            if (primeiroMatch !== -1) cursor = primeiroMatch;
            ultimoEnemyVisto = nomeChefe;
          } else if (nomeChefe !== ultimoEnemyVisto) {
            const proximoMatch = spawnSeq.indexOf(nomeChefe, cursor + 1);
            if (proximoMatch !== -1) {
              cursor = proximoMatch;
            }
            ultimoEnemyVisto = nomeChefe;
          }
          if (Number(rs.current_hp) <= 0 && cursor + 1 < spawnSeq.length) {
            cursor++;
            ultimoEnemyVisto = spawnSeq[cursor];
          }
        }
      }

      if (raidStateAoVivo && raidStateAoVivo.enemy_id) {
        const nomeVivo = raidStateAoVivo.enemy_name || mapaTitansPorId[raidStateAoVivo.enemy_id];
        if (nomeVivo && spawnSeq[cursor] !== nomeVivo) {
          const indicesPossiveis = [];
          spawnSeq.forEach((nome, idx) => {
            if (nome === nomeVivo) indicesPossiveis.push(idx);
          });
          if (indicesPossiveis.length > 0) {
            cursor = indicesPossiveis[indicesPossiveis.length - 1];
          }
        }
      }

      return Math.min(Math.max(0, cursor), spawnSeq.length - 1);
    }

    async function carregarEstadoTita() {
      try {
        const { data: listaSub } = await cofre
          .from("eventos_raid")
          .select("*")
          .ilike("tipo_evento", "%sub_cycle%")
          .order("id", { ascending: false })
          .limit(1);

        const { data: listaGeral } = await cofre
          .from("eventos_raid")
          .select("*")
          .order("id", { ascending: false })
          .limit(100);

        let registroSub = listaSub && listaSub.length > 0 ? listaSub[0] : null;
        let dadosSub = registroSub ? extrairObjeto(registroSub.dados) : null;

        if (!dadosSub && listaGeral) {
          for (const ev of listaGeral) {
            const ext = extrairObjeto(ev.dados);
            if (ext && (ext.raid?.titans || ext.titans)) {
              dadosSub = ext;
              registroSub = ev;
              break;
            }
          }
        }

        if (!dadosSub) {
          document.getElementById("subtitulo-status").innerText = "Aguardando pacote sub_cycle no Supabase...";
          return;
        }

        let raidStateAoVivo = null;
        if (listaGeral && listaGeral.length > 0) {
          for (const ev of listaGeral) {
            const ext = extrairObjeto(ev.dados);
            if (ext && ext.raid_state) {
              raidStateAoVivo = ext.raid_state.current || ext.raid_state;
              break;
            }
          }
        }

        renderizarPainel(dadosSub, raidStateAoVivo, listaGeral || []);

      } catch (erro) {
        console.error("Erro ao carregar anatomia do titã:", erro);
        document.getElementById("subtitulo-status").innerText = "Erro ao sincronizar: " + erro.message;
      }
    }

    function renderizarPainel(dadosSub, raidStateAoVivo, historicoEventos) {
      const raidData = dadosSub.raid || dadosSub;
      const tier = raidData.tier ?? "-";
      const level = raidData.level ?? "-";
      const moraleBonus = dadosSub.morale?.bonus_amount
        ? `+${Math.round(dadosSub.morale.bonus_amount * 100)}%`
        : "0%";

      document.getElementById("txt-tier-nivel").innerText = `T${tier} - Nv.${level}`;
      document.getElementById("txt-moral").innerText = moraleBonus;

      const areaBuffs = raidData.area_buffs || [];
      document.getElementById("txt-buff-area").innerText = areaBuffs.length > 0
        ? areaBuffs.map(b => `${b.bonus_type} (+${Math.round(b.bonus_amount * 100)}%)`).join(", ")
        : "Nenhum";

      const spawnSeq = raidData.spawn_sequence || [];
      const titansCatalogo = raidData.titans || [];

      const indiceFilaAtual = descobrirIndiceNaFila(spawnSeq, dadosSub, raidStateAoVivo, historicoEventos);
      const totalFila = spawnSeq.length || 7;

      document.getElementById("txt-progresso-fila").innerText = `${indiceFilaAtual + 1}º de ${totalFila}`;

      const divFila = document.getElementById("fila-titans");
      if (spawnSeq.length > 0) {
        divFila.innerHTML = spawnSeq.map((nomeTitaFila, idx) => {
          let classeEstado = "";
          if (idx < indiceFilaAtual) {
            classeEstado = "dead";
          } else if (idx === indiceFilaAtual) {
            classeEstado = "current";
          }
          return `
            <div class="spawn-block ${classeEstado}">
              <span class="spawn-num">${idx + 1}º</span>
              <span>${nomeTitaFila}</span>
            </div>
          `;
        }).join("");
      }

      let titanBase = null;
      if (raidStateAoVivo && raidStateAoVivo.enemy_id) {
        titanBase = titansCatalogo.find(t => t.enemy_id === raidStateAoVivo.enemy_id);
      }
      if (!titanBase && spawnSeq[indiceFilaAtual]) {
        const nomeAlvo = spawnSeq[indiceFilaAtual];
        titanBase = titansCatalogo.find(t => t.enemy_name === nomeAlvo);
      }
      if (!titanBase) {
        titanBase = titansCatalogo[0];
      }
      if (!titanBase) return;

      const nomeTitaAtivo = titanBase.enemy_name || mapaTitansPorId[titanBase.enemy_id] || "Titã";
      document.getElementById("txt-nome-tita").innerText = nomeTitaAtivo;
      document.getElementById("titulo-tita").innerText = `Titã Atual: ${nomeTitaAtivo} (${indiceFilaAtual + 1}/${totalFila})`;
      document.getElementById("subtitulo-status").innerText = `Clã ${dadosSub.clan_code || '975xx'} • Atualizado automaticamente em tempo real`;

      const debuffs = titanBase.area_debuffs || [];
      document.getElementById("txt-debuff-tita").innerText = debuffs.length > 0
        ? debuffs.map(d => `${d.bonus_type} (${Math.round(d.bonus_amount * 100)}%)`).join(", ")
        : "Nenhum";

      const usarAoVivo = raidStateAoVivo && raidStateAoVivo.enemy_id === titanBase.enemy_id;

      const hpGlobalTotal = Number(titanBase.total_hp || 1);
      const hpGlobalAtual = usarAoVivo && raidStateAoVivo.current_hp !== undefined
        ? Number(raidStateAoVivo.current_hp)
        : Number(titanBase.current_hp || 0);

      const pctGlobal = Number(((hpGlobalAtual / hpGlobalTotal) * 100).toFixed(1));
      document.getElementById("txt-vida-global").innerText = `${formatarNumero(hpGlobalAtual)} / ${formatarNumero(hpGlobalTotal)} (${pctGlobal}%)`;
      
      const barFill = document.getElementById("bar-vida-global");
      barFill.style.width = `${Math.max(0, Math.min(100, pctGlobal))}%`;
      barFill.style.backgroundColor = obterCorEspectral(pctGlobal);

      // Mapa de Alvos (state "1" = Não Atacar, state "2" = Spinal Tap)
      const mapaAlvos = {};
      const listaTargets = dadosSub.titan_target || [];
      const targetDesteTita = listaTargets.find(t => t.enemy_id === titanBase.enemy_id);
      if (targetDesteTita && Array.isArray(targetDesteTita.state)) {
        targetDesteTita.state.forEach(item => {
          mapaAlvos[item.id] = String(item.state);
        });
      }

      const partesAoVivoMap = {};
      if (usarAoVivo && Array.isArray(raidStateAoVivo.parts)) {
        raidStateAoVivo.parts.forEach(p => {
          partesAoVivoMap[p.part_id] = Number(p.current_hp);
        });
      }

      const partesMapeadas = {};
      (titanBase.parts || []).forEach(p => {
        const tipo = p.part_id.startsWith("Armor") ? "Armor" : "Body";
        const baseName = p.part_id.replace("Armor", "").replace("Body", "");
        if (!partesMapeadas[baseName]) partesMapeadas[baseName] = {};

        const hpAtualReal = partesAoVivoMap[p.part_id] !== undefined
          ? partesAoVivoMap[p.part_id]
          : Number(p.current_hp || 0);

        partesMapeadas[baseName][tipo] = {
          part_id: p.part_id,
          total_hp: Number(p.total_hp || 1),
          current_hp: hpAtualReal
        };
      });

      let htmlOmbrosCabeca = "";
      let htmlMaosPeito = "";
      let htmlPernas = "";

      Object.keys(mapaSlotsAnatomicos).forEach(baseName => {
        const par = partesMapeadas[baseName];
        const classeSlot = mapaSlotsAnatomicos[baseName];
        if (!par || !classeSlot) return;

        let targetParte = null;
        let isArmadura = false;

        if (par.Armor && par.Armor.current_hp > 0) {
          targetParte = par.Armor;
          isArmadura = true;
        } else if (par.Body) {
          targetParte = par.Body;
          isArmadura = false;
        } else if (par.Armor) {
          targetParte = par.Armor;
          isArmadura = true;
        }

        if (targetParte) {
          const currentHp = Number(targetParte.current_hp || 0);
          const totalHp = Number(targetParte.total_hp || 1);
          const isDestruida = currentHp <= 0;
          const pctExata = isDestruida ? 0 : Math.max(0, Math.min(100, (currentHp / totalHp) * 100));
          const pctArredondada = isDestruida ? 0 : Math.round(pctExata);

          const isDecay = !isDestruida && pctExata <= 30;
          const estadoAlvo = mapaAlvos[baseName] || "0";

          // Ajustado: "Smash" virou "Livre"
          let textoTag = "LIVRE";
          let classeTagRect = "";
          let classeTankExtra = "";

          if (isDestruida) {
            textoTag = "DESTRUÍDA";
            classeTagRect = "dead";
            classeTankExtra = "tank-dead";
          } else if (estadoAlvo === "1") {
            textoTag = isDecay ? "NÃO • DECAY" : "NÃO ATACAR";
            classeTagRect = "no-attack";
            classeTankExtra = isDecay ? "tank-decay" : "tank-no-attack";
          } else if (estadoAlvo === "2") {
            textoTag = isDecay ? "SPINAL • DECAY" : "SPINAL TAP";
            classeTagRect = isDecay ? "decay" : "spinal";
            classeTankExtra = isDecay ? "tank-decay" : "tank-spinal";
          } else if (isDecay) {
            textoTag = "DECAY";
            classeTagRect = "decay";
            classeTankExtra = "tank-decay";
          }

          const iconeCanto = isDestruida
            ? "💀"
            : (isArmadura ? "🛡️" : "❤️");

          let classeLiquido = isArmadura ? "liquid-armor" : "liquid-body";
          if (isDecay) {
            classeLiquido = "liquid-decay";
          }

          const unitHtml = `
            <div class="part-unit ${classeSlot}">
              <div class="unit-top-bar">
                <div class="tag-rect ${classeTagRect}">${textoTag}</div>
                <div class="pct-box">${isDestruida ? '-' : pctArredondada + '%'}</div>
              </div>

              <div class="part-tank ${classeTankExtra}">
                <div class="liquid-level ${classeLiquido}" style="height: ${isDestruida ? 0 : pctExata}%;"></div>
                <div class="tank-overlay-top">
                  <span class="tank-icon">${iconeCanto}</span>
                  <span class="tank-hp">${isDestruida ? '0' : formatarNumero(currentHp)}</span>
                </div>
              </div>
            </div>
          `;

          if (baseName.includes("ArmUpper") || baseName === "Head") {
            htmlOmbrosCabeca += unitHtml;
          } else if (baseName.includes("Hand") || baseName === "ChestUpper") {
            htmlMaosPeito += unitHtml;
          } else if (baseName.includes("Leg")) {
            htmlPernas += unitHtml;
          }
        }
      });

      const gridTitam = document.getElementById("grid-titam");
      gridTitam.innerHTML = htmlOmbrosCabeca + htmlMaosPeito + `
        <div class="pernas-container">
          ${htmlPernas}
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      carregarEstadoTita();
    });

    cofre
      .channel("atualizacao-tita")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "eventos_raid" }, () => {
        carregarEstadoTita();
      })
      .subscribe();
  </script>
</body>
</html>
