<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora & Comparador VS • Raid Cards</title>
  <style>
    :root {
      --bg-page: #090d16;
      --bg-surface: #111827;
      --bg-elevated: #172033;
      --bg-input: #0b101b;
      --bg-footer: #0d1320;
      --border: #233047;
      --border-subtle: rgba(35, 48, 71, 0.6);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --purple: #c084fc;
      --red: #f87171;
      --vs-accent: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      padding: 14px 12px 48px;
      font-size: 13.5px;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    /* Header compacto e fixo */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(17, 24, 39, 0.94);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      margin-bottom: 14px;
      position: sticky;
      top: 8px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .brand h1 span {
      color: var(--accent);
    }

    .brand small {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-kpis {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .kpi-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
    }

    .kpi-chip span {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .kpi-chip strong {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--green);
    }

    .kpi-chip.gain strong {
      color: var(--amber);
    }

    .kpi-chip.dmg strong {
      color: var(--accent);
    }

    .btn-reset {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--red);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.74rem;
      transition: all 0.15s ease;
    }

    .btn-reset:hover {
      background: var(--red);
      color: #090d16;
    }

    /* Lista de Confrontos VS */
    .vs-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vs-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .vs-grid {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      position: relative;
    }

    .vs-divider {
      background: var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vs-pill {
      position: absolute;
      background: var(--vs-accent);
      color: #fff;
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 3px 6px;
      border-radius: 999px;
      border: 2px solid var(--bg-surface);
      box-shadow: 0 2px 8px rgba(244, 63, 94, 0.45);
      z-index: 2;
    }

    @media (max-width: 780px) {
      .vs-grid {
        grid-template-columns: 1fr;
      }
      .vs-divider {
        height: 1px;
        width: 100%;
      }
    }

    /* Painel Individual de Cada Deck */
    .deck-pane {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: background-color 0.2s ease;
      min-width: 0;
    }

    .deck-pane.winner-efficiency {
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.05) 0%, transparent 100%);
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .deck-id-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .deck-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
    }

    .roi-badge {
      display: none;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(52, 211, 153, 0.35);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .deck-pane.winner-efficiency .roi-badge {
      display: inline-block;
    }

    .delta-pill {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    /* Barra compacta de Dano Inicial -> Final */
    .dmg-bar {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      align-items: center;
      gap: 5px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 7px;
    }

    .dmg-bar-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      padding-right: 2px;
    }

    .dmg-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .dmg-input-wrap span {
      position: absolute;
      left: 6px;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      pointer-events: none;
    }

    .dmg-input-wrap input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-primary);
      padding: 3px 6px 3px 28px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s;
    }

    .dmg-input-wrap input:focus {
      border-color: var(--accent);
    }

    .dmg-sep {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Tabela compacta das 3 cartas */
    table.cards-table {
      width: 100%;
      border-collapse: collapse;
    }

    table.cards-table th {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      padding: 2px 3px 4px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }

    table.cards-table th.c-lvl,
    table.cards-table td.c-lvl {
      width: 56px;
      text-align: center;
    }

    table.cards-table th.c-cost,
    table.cards-table td.c-cost {
      width: 66px;
      text-align: right;
    }

    table.cards-table td {
      padding: 3px 3px;
      border-bottom: 1px solid rgba(35, 48, 71, 0.35);
    }

    table.cards-table tr:last-child td {
      border-bottom: none;
    }

    .card-name {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.83rem;
      padding: 3px 4px;
      outline: none;
      transition: all 0.15s;
    }

    .card-name:hover {
      background: rgba(11, 16, 27, 0.45);
    }

    .card-name:focus {
      background: var(--bg-input);
      border-color: var(--border);
    }

    .lvl-box {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      padding: 3px 2px;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
    }

    .lvl-box:focus {
      border-color: var(--accent);
    }

    .cost-cell {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--amber);
    }

    /* Rodapé compacto do Deck */
    .deck-summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.74rem;
    }

    .deck-summary-bar .cost-total {
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .deck-summary-bar .cost-total strong {
      color: var(--green);
      font-size: 0.88rem;
      margin-left: 3px;
    }

    .deck-summary-bar .base-power {
      color: var(--text-muted);
      font-size: 0.71rem;
      white-space: nowrap;
    }

    .deck-summary-bar .base-power strong {
      color: var(--purple);
      font-weight: 600;
    }

    /* Barra de Comparação VS acoplada na base */
    .vs-telemetry {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--bg-footer);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 780px) {
      .vs-telemetry {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 460px) {
      .vs-telemetry {
        grid-template-columns: 1fr;
      }
    }

    .tele-item {
      padding: 7px 10px;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .tele-item:last-child {
      border-right: none;
    }

    @media (max-width: 780px) {
      .tele-item:nth-child(2) {
        border-right: none;
      }
      .tele-item:nth-child(1),
      .tele-item:nth-child(2) {
        border-bottom: 1px solid var(--border-subtle);
      }
    }

    .tele-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
    }

    .tele-val {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .tele-sub {
      font-size: 0.69rem;
      color: var(--text-secondary);
    }

    .c-green { color: var(--green); }
    .c-amber { color: var(--amber); }
    .c-cyan  { color: var(--accent); }
    .c-muted { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Calculadora <span>VS</span> • Raid Cards</h1>
        <small>Níveis 0–150 • K, M, B, T</small>
      </div>
      <div class="header-kpis">
        <div class="kpi-chip">
          <span>Custo</span>
          <strong id="grand-cost">0</strong>
        </div>
        <div class="kpi-chip gain">
          <span>Ganho</span>
          <strong id="grand-gain">+0</strong>
        </div>
        <div class="kpi-chip dmg">
          <span>Dano Final</span>
          <strong id="grand-damage">0</strong>
        </div>
        <button type="button" class="btn-reset" onclick="resetAll()">Limpar</button>
      </div>
    </header>

    <main class="vs-list" id="vs-container"></main>
  </div>

    };

    const NUM_DECKS = 8;
    const CARDS_PER_DECK = 3;
    const STORAGE_KEY = 'raid_card_calculator_vs_v3';

    function formatInt(num) {
      return Math.round(num).toLocaleString('pt-BR');
    }

    function formatCompactDamage(num) {
      if (!num || isNaN(num)) return '0';
      const abs = Math.abs(num);
      const sign = num < 0 ? '-' : '';
      if (abs >= 1e12) return sign + (abs / 1e12).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + 'T';
      if (abs >= 1e9)  return sign + (abs / 1e9).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + 'B';
      if (abs >= 1e6)  return sign + (abs / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + 'M';
      if (abs >= 1e3)  return sign + (abs / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + 'K';
      return sign + abs.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
    }

    function formatSignedDamage(num) {
      if (!num || isNaN(num)) return '+0';
      const formatted = formatCompactDamage(num);
      return num > 0 ? `+${formatted}` : formatted;
    }

    function parseDamageInput(raw) {
      if (!raw) return 0;
      const cleaned = raw.trim().toUpperCase().replace(/\s+/g, '').replace(',', '.');
      const match = cleaned.match(/^([+-]?\d*\.?\d+)([KMBT]?)$/);
      if (!match) return 0;

      const value = parseFloat(match[1]);
      if (isNaN(value)) return 0;

      const multipliers = { '': 1, 'K': 1e3, 'M': 1e6, 'B': 1e9, 'T': 1e12 };
      return value * (multipliers[match[2]] || 1);
    }

    function clampLevel(val) {
      const parsed = parseInt(val, 10);
      if (isNaN(parsed) || parsed < 0) return 0;
      if (parsed > 150) return 150;
      return parsed;
    }

    function calculateUpgradeCost(before, after) {
      const start = clampLevel(before);
      const end = clampLevel(after);
      if (end <= start) return 0;

      let total = 0;
      for (let lvl = start + 1; lvl <= end; lvl++) {
        total += LEVEL_COSTS[lvl] || 0;
      }
      return total;
    }

    function createDeckHTML(d) {
      let rowsHTML = '';
      for (let c = 1; c <= CARDS_PER_DECK; c++) {
        rowsHTML += `

                type="text"

                id="d${d}-c${c}-name"
                placeholder="Carta ${c}"

      return `

    function buildUI() {
      const container = document.getElementById('vs-container');
      container.innerHTML = '';

      for (let d = 1; d <= NUM_DECKS; d += 2) {
        const pairIndex = (d + 1) / 2;
        const card = document.createElement('article');
        card.className = 'vs-card';
        card.innerHTML = `
          <div class="vs-grid">
            ${createDeckHTML(d)}
            <div class="vs-divider"><span class="vs-pill">VS</span></div>
            ${createDeckHTML(d + 1)}
          </div>

          <div class="vs-telemetry" id="vs-analytics-${pairIndex}">
            <div class="tele-item">
              <span class="tele-label">Diferença de Custo</span>
              <span class="tele-val" id="vs${pairIndex}-cost-main">Empate (0)</span>
              <span class="tele-sub" id="vs${pairIndex}-cost-sub">Investimento idêntico</span>
            </div>

            <div class="tele-item">
              <span class="tele-label">Ganho Real (Fim − Ini)</span>
              <span class="tele-val" id="vs${pairIndex}-gain-main">Aguardando...</span>
              <span class="tele-sub" id="vs${pairIndex}-gain-sub">Preencha Dano Ini e Fim</span>
            </div>

            <div class="tele-item">
              <span class="tele-label">Dano Final Absoluto</span>
              <span class="tele-val" id="vs${pairIndex}-final-main">Aguardando...</span>
              <span class="tele-sub" id="vs${pairIndex}-final-sub">Teto pós-upgrade</span>
            </div>

            <div class="tele-item">
              <span class="tele-label">Custo-Benefício (Ganho / 1k)</span>
              <span class="tele-val" id="vs${pairIndex}-eff-main">—</span>
              <span class="tele-sub" id="vs${pairIndex}-eff-sub">Retorno por 1k custo</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    function updateAll() {
      let grandCost = 0;
      let grandFinalDamage = 0;
      let grandGainDamage = 0;
      const state = {};
      const deckStats = {};

      for (let d = 1; d <= NUM_DECKS; d++) {
        let deckCost = 0;
        let baseDmgStart = 0;
        let baseDmgEnd = 0;

        const rawStart = document.getElementById(`d${d}-dmg-start`).value;
        const rawEnd = document.getElementById(`d${d}-dmg-end`).value;

        const dmgStart = parseDamageInput(rawStart);
        const dmgEnd = parseDamageInput(rawEnd);
        const dmgGain = (rawStart !== '' || rawEnd !== '') ? (dmgEnd - dmgStart) : 0;

        state[`d${d}`] = {
          dmgStart: rawStart,
          dmgEnd: rawEnd,
          cards: {}
        };

        for (let c = 1; c <= CARDS_PER_DECK; c++) {
          const name = document.getElementById(`d${d}-c${c}-name`).value;
          const beforeRaw = document.getElementById(`d${d}-c${c}-before`).value;
          const afterRaw = document.getElementById(`d${d}-c${c}-after`).value;

          const startLvl = clampLevel(beforeRaw);
          const endLvl = afterRaw === '' ? startLvl : clampLevel(afterRaw);

          const cardCost = calculateUpgradeCost(startLvl, endLvl);
          document.getElementById(`d${d}-c${c}-cost`).textContent = formatInt(cardCost);

          deckCost += cardCost;
          baseDmgStart += LEVEL_DAMAGE[startLvl] || 0;
          baseDmgEnd += LEVEL_DAMAGE[endLvl] || 0;

          state[`d${d}`].cards[`c${c}`] = {
            name,
            before: beforeRaw,
            after: afterRaw
          };
        }

        const deltaBadge = document.getElementById(`d${d}-dmg-delta`);
        const gainPct = dmgStart > 0
          ? (((dmgEnd - dmgStart) / dmgStart) * 100).toFixed(1)
          : (dmgEnd > 0 ? '100.0' : '0.0');

        deltaBadge.textContent = `${formatSignedDamage(dmgGain)} (${dmgGain >= 0 ? '+' : ''}${gainPct}%)`;
        deltaBadge.style.color = dmgGain > 0 ? 'var(--green)' : (dmgGain < 0 ? 'var(--red)' : 'var(--text-secondary)');
        deltaBadge.style.borderColor = dmgGain > 0 ? 'rgba(52, 211, 153, 0.4)' : 'var(--border)';

        const theoryPct = baseDmgStart > 0
          ? (((baseDmgEnd - baseDmgStart) / baseDmgStart) * 100).toFixed(1)
          : (baseDmgEnd > 0 ? '100.0' : '0.0');

        document.getElementById(`d${d}-total`).textContent = formatInt(deckCost);
        document.getElementById(`d${d}-theory`).textContent =
          `${baseDmgStart.toFixed(1)} → ${baseDmgEnd.toFixed(1)} (${theoryPct >= 0 ? '+' : ''}${theoryPct}%)`;

        deckStats[d] = {
          cost: deckCost,
          dmgStart,
          dmgEnd,
          dmgGain,
          gainPct: parseFloat(gainPct)
        };

        grandCost += deckCost;
        grandFinalDamage += dmgEnd;
        grandGainDamage += dmgGain;
      }

      for (let d = 1; d <= NUM_DECKS; d += 2) {
        const pairIndex = (d + 1) / 2;
        const a = deckStats[d];
        const b = deckStats[d + 1];

        // 1. Custo
        const costMain = document.getElementById(`vs${pairIndex}-cost-main`);
        const costSub = document.getElementById(`vs${pairIndex}-cost-sub`);
        const costDiff = Math.abs(a.cost - b.cost);

        if (a.cost === b.cost) {
          costMain.innerHTML = `<span class="c-amber">Empate (${formatInt(a.cost)})</span>`;
          costSub.textContent = 'Investimento idêntico';
        } else {
          const cheaper = a.cost < b.cost ? d : d + 1;
          const expensive = a.cost < b.cost ? d + 1 : d;
          const minCost = Math.min(a.cost, b.cost);
          const pctMore = minCost > 0 ? ((costDiff / minCost) * 100).toFixed(1) : '∞';
          costMain.innerHTML = `<span class="c-green">Deck ${cheaper} poupa ${formatInt(costDiff)}</span>`;
          costSub.textContent = `Deck ${expensive} custa +${pctMore}%`;
        }

        // 2. Ganho Real
        const gainMain = document.getElementById(`vs${pairIndex}-gain-main`);
        const gainSub = document.getElementById(`vs${pairIndex}-gain-sub`);

        if (a.dmgGain === 0 && b.dmgGain === 0) {
          gainMain.innerHTML = `<span class="c-muted">Aguardando...</span>`;
          gainSub.textContent = 'Preencha Dano Ini e Fim';
        } else if (a.dmgGain === b.dmgGain) {
          gainMain.innerHTML = `<span class="c-amber">Empate (${formatSignedDamage(a.dmgGain)})</span>`;
          gainSub.textContent = 'Mesmo salto de dano';
        } else {
          const gainWinner = a.dmgGain > b.dmgGain ? d : d + 1;
          const gainLoser = a.dmgGain > b.dmgGain ? d + 1 : d;
          const diffGain = Math.abs(a.dmgGain - b.dmgGain);
          const winObj = a.dmgGain > b.dmgGain ? a : b;
          const loseObj = a.dmgGain > b.dmgGain ? b : a;

          gainMain.innerHTML = `<span class="c-green">Deck ${gainWinner} +${formatCompactDamage(diffGain)}</span>`;
          gainSub.textContent = `D${gainWinner}: ${formatSignedDamage(winObj.dmgGain)} (${winObj.gainPct}%) vs D${gainLoser}: ${formatSignedDamage(loseObj.dmgGain)} (${loseObj.gainPct}%)`;
        }

        // 3. Dano Final Absoluto
        const finalMain = document.getElementById(`vs${pairIndex}-final-main`);
        const finalSub = document.getElementById(`vs${pairIndex}-final-sub`);

        if (a.dmgEnd === 0 && b.dmgEnd === 0) {
          finalMain.innerHTML = `<span class="c-muted">Aguardando...</span>`;
          finalSub.textContent = 'Teto pós-upgrade';
        } else if (a.dmgEnd === b.dmgEnd) {
          finalMain.innerHTML = `<span class="c-amber">Empate (${formatCompactDamage(a.dmgEnd)})</span>`;
          finalSub.textContent = 'Mesmo dano final';
        } else {
          const finalWinner = a.dmgEnd > b.dmgEnd ? d : d + 1;
          const finalLoser = a.dmgEnd > b.dmgEnd ? d + 1 : d;
          const minEnd = Math.min(a.dmgEnd, b.dmgEnd);
          const endDiff = Math.abs(a.dmgEnd - b.dmgEnd);
          const pctMoreEnd = minEnd > 0 ? ((endDiff / minEnd) * 100).toFixed(1) : '∞';

          finalMain.innerHTML = `<span class="c-cyan">Deck ${finalWinner} +${formatCompactDamage(endDiff)}</span>`;
          finalSub.textContent = `Bate +${pctMoreEnd}% que Deck ${finalLoser}`;
        }

        // 4. Custo-Benefício (ROI)
        const effMain = document.getElementById(`vs${pairIndex}-eff-main`);
        const effSub = document.getElementById(`vs${pairIndex}-eff-sub`);
        const blockA = document.getElementById(`deck-block-${d}`);
        const blockB = document.getElementById(`deck-block-${d + 1}`);
        blockA.classList.remove('winner-efficiency');
        blockB.classList.remove('winner-efficiency');

        const effA = (a.cost > 0 && a.dmgGain > 0) ? (a.dmgGain / (a.cost / 1000)) : 0;
        const effB = (b.cost > 0 && b.dmgGain > 0) ? (b.dmgGain / (b.cost / 1000)) : 0;

        if (effA === 0 && effB === 0) {
          effMain.innerHTML = `<span class="c-muted">—</span>`;
          effSub.textContent = 'Retorno por 1k custo';
        } else if (effA === effB) {
          effMain.innerHTML = `<span class="c-amber">Empate (${formatCompactDamage(effA)}/1k)</span>`;
          effSub.textContent = 'Mesma eficiência';
        } else {
          const effWinner = effA > effB ? d : d + 1;
          const winVal = Math.max(effA, effB);
          const loseVal = Math.min(effA, effB);
          if (effA > effB) blockA.classList.add('winner-efficiency');
          else blockB.classList.add('winner-efficiency');

          effMain.innerHTML = `<span class="c-green">Deck ${effWinner} (${formatCompactDamage(winVal)}/1k)</span>`;
          effSub.textContent = `Contra ${formatCompactDamage(loseVal)}/1k do outro`;
        }
      }

      document.getElementById('grand-cost').textContent = formatInt(grandCost);
      document.getElementById('grand-gain').textContent = formatSignedDamage(grandGainDamage);
      document.getElementById('grand-damage').textContent = formatCompactDamage(grandFinalDamage);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;

      try {
        const state = JSON.parse(saved);
        for (let d = 1; d <= NUM_DECKS; d++) {
          const deckData = state[`d${d}`];
          if (!deckData) continue;

          document.getElementById(`d${d}-dmg-start`).value = deckData.dmgStart || '';
          document.getElementById(`d${d}-dmg-end`).value = deckData.dmgEnd || '';
          for (let c = 1; c <= CARDS_PER_DECK; c++) {
            const cardData = deckData.cards?.[`c${c}`];
            if (!cardData) continue;

            document.getElementById(`d${d}-c${c}-name`).value = cardData.name || '';
            document.getElementById(`d${d}-c${c}-before`).value = cardData.before || '';
            document.getElementById(`d${d}-c${c}-after`).value = cardData.after || '';
          }
        }
      } catch (e) {
        console.error('Erro ao carregar dados salvos:', e);
      }
    }

    function resetAll() {
      if (!confirm('Deseja limpar todos os níveis, nomes e danos preenchidos?')) return;
      localStorage.removeItem(STORAGE_KEY);
      buildUI();
      updateAll();
    }

    buildUI();
    loadState();
    updateAll();
  </script>
</body>
</html>
