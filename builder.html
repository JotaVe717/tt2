<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Decks de Raid por Buff - Tap Titans 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f141c;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 8px calc(20px + env(safe-area-inset-bottom, 0px)) 8px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      width: 100%;
      max-width: 1040px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      background: rgba(15, 20, 28, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 4px;
      z-index: 50;
      border-bottom: 1px solid #1a2533;
    }
    .back-btn {
      text-decoration: none;
      color: #8fa0b5;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .back-btn:hover { color: #f5a623; }

    .base-level-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #18202a;
      border: 1px solid #2d3e52;
      padding: 4px 10px;
      border-radius: 5px;
    }
    .base-level-compact label {
      font-size: 10px;
      font-weight: 800;
      color: #e2b4f7;
      text-transform: uppercase;
    }
    .base-level-compact input {
      width: 48px;
      height: 23px;
      background: #0f141c;
      border: 1.5px solid #8e44ad;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      border-radius: 4px;
      outline: none;
    }

    /* GRADE PRINCIPAL: 4 EM CIMA E 4 EM BAIXO COM LARGURA JUSTA (SEM SOBRAS) */
    .buff-sections-container {
      width: auto;
      max-width: 1040px;
      display: grid;
      grid-template-columns: repeat(4, 240px);
      justify-content: center;
      gap: 10px;
    }

    @media (max-width: 1020px) {
      .buff-sections-container {
        grid-template-columns: repeat(2, 240px);
      }
    }

    @media (max-width: 510px) {
      .buff-sections-container {
        grid-template-columns: 240px;
      }
    }

    /* CARD DE CADA BUFF MOLDADO AO CONTEÚDO */
    .buff-group-card {
      background: #10161f;
      border: 1.5px solid #1f2b38;
      border-radius: 8px;
      padding: 6px 5px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      width: 240px;
    }

    .buff-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 4px 2px;
      border-bottom: 1px solid #1a2533;
    }
    .buff-badge-title {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-reset-group {
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.6);
      color: #ff6b6b;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-reset-group:hover {
      background: rgba(231, 76, 60, 0.25);
    }

    .decks-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* LINHA DO DECK: 100% PREENCHIDA E ENXUTA */
    .deck-row-card {
      background: #141c26;
      border: 1px solid #243344;
      border-radius: 6px;
      padding: 3px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      width: 100%;
    }

    .deck-side-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 38px;
      min-width: 38px;
      flex-shrink: 0;
      text-align: center;
      gap: 2px;
    }
    .deck-num {
      font-size: 11px;
      font-weight: 900;
      color: #f5a623;
      line-height: 1;
    }
    .deck-rule-tag {
      font-size: 6.5px;
      font-weight: 800;
      padding: 1.5px 2px;
      border-radius: 2px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      width: 100%;
      text-align: center;
    }
    .status-complete {
      background: rgba(80, 227, 194, 0.15);
      border: 1px solid #50e3c2;
      color: #50e3c2;
    }
    .status-incomplete {
      background: rgba(143, 160, 181, 0.12);
      border: 1px solid #3c4f66;
      color: #8fa0b5;
    }
    .status-custom {
      background: rgba(245, 166, 35, 0.15);
      border: 1px solid #f5a623;
      color: #f5a623;
    }

    /* SLOTS PERFEITAMENTE 1:1 FIXADOS EM 58px */
    .deck-slots-row {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .slot-box {
      width: 58px;
      height: 58px;
      aspect-ratio: 1 / 1;
      background: #0f141c;
      border: 1.2px dashed #3a4b60;
      border-radius: 5px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }
    .slot-box.filled {
      border-style: solid;
      border-color: #2b394a;
    }
    .slot-box.active-selecting {
      border-color: #f5a623 !important;
    }

    .slot-empty-icon {
      font-size: 12px;
      color: #4f637b;
      line-height: 1;
    }
    .slot-empty-text {
      font-size: 6.5px;
      font-weight: 700;
      color: #5c728e;
      text-transform: uppercase;
    }

    .slot-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slot-badge-role {
      position: absolute;
      bottom: 1.5px;
      left: 1.5px;
      font-size: 6px;
      font-weight: 800;
      padding: 0.5px 2.5px;
      border-radius: 2px;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
      pointer-events: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .slot-sug-lvl {
      position: absolute;
      bottom: 1.5px;
      right: 1.5px;
      background: rgba(15, 20, 28, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #50e3c2;
      font-weight: 900;
      font-size: 6.5px;
      padding: 0.5px 2.5px;
      border-radius: 2px;
      line-height: 1;
      pointer-events: none;
    }

    .btn-remove-card {
      position: absolute;
      top: 1.5px;
      right: 1.5px;
      width: 12px;
      height: 12px;
      background: rgba(15, 20, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ff5252;
      border-radius: 50%;
      font-size: 8.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
    }

    /* CORES DE FUNÇÃO */
    .role-dano { background: #e74c3c; }
    .role-buff { background: #27ae60; }
    .role-efeito { background: #2980b9; }
    .role-especifico { background: #576574; }

    /* MODAL DE SELEÇÃO */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #18202a;
      border: 1.5px solid #2d3e52;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
    }
    .modal-header {
      padding: 8px 10px;
      border-bottom: 1px solid #243344;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #f5a623;
    }
    .modal-close {
      background: none;
      border: none;
      color: #8fa0b5;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body {
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-group-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .modal-cards-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }
    .modal-card-item {
      aspect-ratio: 1 / 1;
      border-radius: 5px;
      border: 1.2px solid #2d3e52;
      background: #101721;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .modal-card-item.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      filter: grayscale(1);
    }
    .modal-card-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="nivelamento_decks.html" class="back-btn">&larr; Voltar</a>
    <div class="base-level-compact">
      <label for="deckBaseLevel">Nível Base:</label>
      <input type="number" id="deckBaseLevel" value="60" min="1" max="100">
    </div>
  </div>

  <div class="buff-sections-container" id="buffSectionsContainer"></div>

  <!-- MODAL DE SELEÇÃO -->
  <div class="modal-overlay" id="modalPicker">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalPickerTitle">Escolha a Carta</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const BUFF_BLOCKS = [
      // Linha Superior (Aflição + 3s)
      { id: "buff_affliction_dmg", name: "+30% Dano de Aflição", color: "#3498db" },
      { id: "buff_affliction_ch",  name: "x1.3 Chance de Aflição", color: "#3498db" },
      { id: "buff_affliction_dur", name: "+50% Duração de Aflição", color: "#3498db" },
      { id: "buff_duration_3s",    name: "+3s Duração", color: "#9b59b6" },

      // Linha Inferior (Explosão + Suporte + All Raid)
      { id: "buff_burst_dmg",      name: "+30% Dano de Explosão", color: "#e67e22" },
      { id: "buff_burst_ch",       name: "x1.3 Chance de Explosão", color: "#e67e22" },
      { id: "buff_support_eff",    name: "+15% Efeito de Suporte", color: "#2ecc71" },
      { id: "buff_all_raid_dmg",   name: "+15% All Raid Damage", color: "#f1c40f" }
    ];

    const CARDS = [
      // DANO
      { id: "mf", name: "Mirror Force", role: "dano", roleLabel: "Dano", img: "Cards/mf.png" },
      { id: "csb", name: "Clanship Barrage", role: "dano", roleLabel: "Dano", img: "Cards/csb.png" },
      { id: "cs", name: "Celestial Static", role: "dano", roleLabel: "Dano", img: "Cards/cs.png" },
      { id: "wol", name: "Whip of Lightning", role: "dano", roleLabel: "Dano", img: "Cards/wol.png" },
      { id: "cov", name: "Chain of Vengeance", role: "dano", roleLabel: "Dano", img: "Cards/cov.png" },
      { id: "fs", name: "Flak Shot", role: "dano", roleLabel: "Dano", img: "Cards/fs.png" },
      { id: "mb", name: "Moon Beam", role: "dano", roleLabel: "Dano", img: "Cards/mb.png" },
      { id: "sb", name: "Skull Bash", role: "dano", roleLabel: "Dano", img: "Cards/sb.png" },
      { id: "fr", name: "Fragmentize", role: "dano", roleLabel: "Dano", img: "Cards/fr.png" },
      { id: "rw", name: "Razor Wind", role: "dano", roleLabel: "Dano", img: "Cards/rw.png" },
      { id: "ps", name: "Psychic Shackles", role: "dano", roleLabel: "Dano", img: "Cards/ps.png" },
      { id: "pb", name: "Purifying Blast", role: "dano", roleLabel: "Dano", img: "Cards/pb.png" },
      { id: "ch", name: "Cosmic Haymaker", role: "dano", roleLabel: "Dano", img: "Cards/ch.png" },
      { id: "bm", name: "Barbed Morningstar", role: "dano", roleLabel: "Dano", img: "Cards/bm.png" },
      { id: "zz", name: "Electro Zap", role: "dano", roleLabel: "Dano", img: "Cards/zz.png" },
      { id: "rr", name: "Ruinous Rain", role: "dano", roleLabel: "Dano", img: "Cards/rr.png" },
      { id: "tp", name: "Thriving Plague", role: "dano", roleLabel: "Dano", img: "Cards/tp.png" },
      { id: "fb", name: "Fusion Bomb", role: "dano", roleLabel: "Dano", img: "Cards/fb.png" },
      { id: "ra", name: "Radioactivity", role: "dano", roleLabel: "Dano", img: "Cards/ra.png" },
      { id: "bi", name: "Blazing Inferno", role: "dano", roleLabel: "Dano", img: "Cards/bi.png" },
      { id: "ds", name: "Decaying Strike", role: "dano", roleLabel: "Dano", img: "Cards/ds.png" },
      { id: "rs", name: "Ravenous Swarm", role: "dano", roleLabel: "Dano", img: "Cards/rs.png" },
      { id: "bb", name: "Corrosive Bubbles", role: "dano", roleLabel: "Dano", img: "Cards/bb.png" },
      { id: "gs", name: "Grim Shadow", role: "dano", roleLabel: "Dano", img: "Cards/gs.png" },
      { id: "ad", name: "Acid Drench", role: "dano", roleLabel: "Dano", img: "Cards/ad.png" },
      { id: "am", name: "Amplify", role: "dano", roleLabel: "Dano", img: "Cards/am.png" },

      // BUFF
      { id: "if", name: "Inspiring Force", role: "buff", roleLabel: "Buff", img: "Cards/if.png" },
      { id: "pr", name: "Prismatic Rift", role: "buff", roleLabel: "Buff", img: "Cards/pr.png" },
      { id: "ma", name: "Maelstrom", role: "buff", roleLabel: "Buff", img: "Cards/ma.png" },
      { id: "gb", name: "Guard Break", role: "buff", roleLabel: "Buff", img: "Cards/gb.png" },
      { id: "tot", name: "Totem of Power", role: "buff", roleLabel: "Buff", img: "Cards/tot.png" },
      { id: "ci", name: "Crushing Instinct", role: "buff", roleLabel: "Buff", img: "Cards/ci.png" },
      { id: "sf", name: "Soul Fire", role: "buff", roleLabel: "Buff", img: "Cards/sf.png" },
      { id: "rk", name: "Radiant Kaleidoscope", role: "buff", roleLabel: "Buff", img: "Cards/rk.png" },
      { id: "ss", name: "Skeletal Smash", role: "buff", roleLabel: "Buff", img: "Cards/ss.png" },
      { id: "iv", name: "Insanity Void", role: "buff", roleLabel: "Buff", img: "Cards/iv.png" },
      { id: "vm", name: "Victory March", role: "buff", roleLabel: "Buff", img: "Cards/vm.png" },
      { id: "bd", name: "Battle Drums", role: "buff", roleLabel: "Buff", img: "Cards/bd.png" },

      // FIXO
      { id: "af", name: "Ancestral Favor", role: "efeito", roleLabel: "Fixo", img: "Cards/af.png" },
      { id: "rg", name: "Rancid Gas", role: "efeito", roleLabel: "Fixo", img: "Cards/rg.png" },
      { id: "ae", name: "Astral Echo", role: "efeito", roleLabel: "Fixo", img: "Cards/ae.png" },
      { id: "tt", name: "Team Tactics", role: "efeito", roleLabel: "Fixo", img: "Cards/tt.png" },

      // ESPECÍFICO
      { id: "sot", name: "Sands of Time", role: "especifico", roleLabel: "Espec.", img: "Cards/sot.png" }
    ];

    const AFFLICTION_ACTIVATORS_FOR_PB = [
      "ad", "bi", "ds", "fb", "gs", "tp", "ra", "rs", "rr", "bb", "ma", "am", "sot"
    ];

    const STORAGE_PREFIX = "tt2_buff_decks_v2_";
    const BASE_STORAGE_KEY = "tt2_base_lvl_v1";

    function createEmptyDecks() {
      return [
        [null, null, null],
        [null, null, null],
        [null, null, null],
        [null, null, null],
        [null, null, null],
        [null, null, null]
      ];
    }

    const allBuffDecks = {};
    BUFF_BLOCKS.forEach(b => {
      allBuffDecks[b.id] = createEmptyDecks();
    });

    let currentSelecting = null;

    function getBaseLevel() {
      const input = document.getElementById("deckBaseLevel");
      let base = parseInt(input.value, 10);
      return isNaN(base) ? 0 : base;
    }

    function loadSavedData() {
      try {
        BUFF_BLOCKS.forEach(b => {
          const saved = localStorage.getItem(STORAGE_PREFIX + b.id);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length === 6) {
              allBuffDecks[b.id] = parsed;
            }
          }
        });

        const savedBase = localStorage.getItem(BASE_STORAGE_KEY);
        if (savedBase) {
          document.getElementById("deckBaseLevel").value = savedBase;
        }
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
      }
    }

    function saveBuffDecks(buffId) {
      try {
        localStorage.setItem(STORAGE_PREFIX + buffId, JSON.stringify(allBuffDecks[buffId]));
      } catch (e) {
        console.error("Erro ao salvar:", e);
      }
    }

    function saveBaseLevel() {
      try {
        localStorage.setItem(BASE_STORAGE_KEY, document.getElementById("deckBaseLevel").value);
      } catch (e) {
        console.error("Erro ao salvar base level:", e);
      }
    }

    function calculateDeckLevels(deck) {
      const base = getBaseLevel();
      const cardDatas = deck.map(id => id ? CARDS.find(c => c.id === id) : null);

      if (cardDatas.some(c => c === null)) {
        return {
          statusText: `${deck.filter(c => c !== null).length}/3`,
          statusClass: "status-incomplete",
          levels: [null, null, null],
          effectiveRoles: cardDatas.map(c => c ? c.role : null),
          effectiveLabels: cardDatas.map(c => c ? c.roleLabel : "")
        };
      }

      let roles = cardDatas.map(c => c.role);
      let roleLabels = cardDatas.map(c => c.roleLabel);

      const hasPB = deck.includes("pb");
      if (hasPB) {
        const affIdx = deck.findIndex(id => id !== "pb" && AFFLICTION_ACTIVATORS_FOR_PB.includes(id));
        if (affIdx !== -1) {
          roles[affIdx] = "especifico";
          roleLabels[affIdx] = "Espec.";
        }
      }

      const counts = { dano: 0, buff: 0, efeito: 0, especifico: 0 };
      roles.forEach(r => counts[r] = (counts[r] || 0) + 1);

      let ruleName = "";
      const levels = [0, 0, 0];

      if (counts.dano === 1 && counts.especifico === 1 && counts.buff === 1) {
        ruleName = "Regra 5";
        roles.forEach((r, idx) => {
          if (r === "dano") levels[idx] = Math.max(0, base + 10);
          else if (r === "especifico") levels[idx] = Math.max(20, base - 30);
          else if (r === "buff") levels[idx] = Math.max(0, base + 10);
        });
      } else if (counts.dano === 1 && counts.buff === 1 && counts.efeito === 1) {
        ruleName = "Regra 1";
        roles.forEach((r, idx) => {
          if (r === "dano") levels[idx] = Math.max(0, base + 10);
          else if (r === "buff") levels[idx] = Math.max(0, base);
          else if (r === "efeito") levels[idx] = Math.max(0, base - 20);
        });
      } else if (counts.dano === 2 && counts.buff === 1) {
        ruleName = "Regra 2";
        roles.forEach((r, idx) => {
          if (r === "dano") levels[idx] = Math.max(0, base - 10);
          else if (r === "buff") levels[idx] = Math.max(0, base + 10);
        });
      } else if (counts.dano === 1 && counts.buff === 2) {
        ruleName = "Regra 3";
        roles.forEach((r, idx) => {
          if (r === "dano") levels[idx] = Math.max(0, base + 10);
          else if (r === "buff") levels[idx] = Math.max(0, base - 10);
        });
      } else if (counts.dano === 1 && counts.efeito === 2) {
        ruleName = "Regra 4";
        roles.forEach((r, idx) => {
          if (r === "dano") levels[idx] = Math.max(0, base + 10);
          else if (r === "efeito") levels[idx] = Math.max(0, base - 10);
        });
      } else {
        ruleName = "Misto";
        roles.forEach((r, idx) => {
          if (r === "dano") levels[idx] = Math.max(0, base + 10);
          else if (r === "buff") levels[idx] = Math.max(0, base);
          else if (r === "efeito") levels[idx] = Math.max(0, base - 10);
          else if (r === "especifico") levels[idx] = Math.max(20, base - 30);
        });
      }

      const amIndex = deck.indexOf("am");
      if (amIndex !== -1) {
        levels[amIndex] = levels[amIndex] + 1;
        const bonusAmplify = Math.ceil(levels[amIndex] / 10);
        [0, 1, 2].forEach(idx => {
          if (idx !== amIndex) {
            levels[idx] = Math.max(0, levels[idx] - bonusAmplify);
          }
        });
      }

      const isCustom = ruleName === "Misto";
      return {
        statusText: ruleName,
        statusClass: isCustom ? "status-custom" : "status-complete",
        levels,
        effectiveRoles: roles,
        effectiveLabels: roleLabels
      };
    }

    function renderAll() {
      const mainContainer = document.getElementById("buffSectionsContainer");
      mainContainer.innerHTML = "";

      BUFF_BLOCKS.forEach(buff => {
        const groupCard = document.createElement("div");
        groupCard.className = "buff-group-card";

        groupCard.innerHTML = `
          <div class="buff-group-header">
            <span class="buff-badge-title" style="color: ${buff.color};">
              <span>✦</span> ${buff.name}
            </span>
            <button class="btn-reset-group" onclick="resetBuffGroup('${buff.id}')">Limpar</button>
          </div>
          <div class="decks-container" id="decks-container-${buff.id}"></div>
        `;

        const decksListDiv = groupCard.querySelector(`#decks-container-${buff.id}`);
        const currentGroupDecks = allBuffDecks[buff.id];

        currentGroupDecks.forEach((deck, dIdx) => {
          const deckCalc = calculateDeckLevels(deck);
          const deckRow = document.createElement("div");
          deckRow.className = "deck-row-card";

          deckRow.innerHTML = `
            <div class="deck-side-info">
              <span class="deck-num">#${dIdx + 1}</span>
              <span class="deck-rule-tag ${deckCalc.statusClass}">${deckCalc.statusText}</span>
            </div>
            <div class="deck-slots-row" id="slots-${buff.id}-${dIdx}"></div>
          `;

          const slotsRow = deckRow.querySelector(`#slots-${buff.id}-${dIdx}`);

          deck.forEach((cardId, sIdx) => {
            const slot = document.createElement("div");
            const isCurrent = currentSelecting &&
                              currentSelecting.buffId === buff.id &&
                              currentSelecting.deckIndex === dIdx &&
                              currentSelecting.slotIndex === sIdx;

            slot.className = `slot-box ${cardId ? "filled" : ""} ${isCurrent ? "active-selecting" : ""}`;

            if (cardId) {
              const cardData = CARDS.find(c => c.id === cardId) || { name: cardId, role: "dano", roleLabel: "Dano", img: "Cards/wc.png" };
              const sugLvl = deckCalc.levels[sIdx];
              const currentRole = deckCalc.effectiveRoles[sIdx] || cardData.role;
              const currentRoleLabel = deckCalc.effectiveLabels[sIdx] || cardData.roleLabel;
              const lvlBadge = sugLvl !== null ? `<span class="slot-sug-lvl">${sugLvl}</span>` : "";

              slot.innerHTML = `
                <img src="${cardData.img}" class="slot-img" alt="${cardData.name}" onerror="this.src='Cards/wc.png'">
                <span class="slot-badge-role role-${currentRole}">${currentRoleLabel}</span>
                ${lvlBadge}
                <button class="btn-remove-card" title="Remover">&times;</button>
              `;

              slot.querySelector(".btn-remove-card").onclick = (e) => {
                e.stopPropagation();
                removeCard(buff.id, dIdx, sIdx);
              };

              slot.onclick = () => openPicker(buff.id, dIdx, sIdx);
            } else {
              slot.innerHTML = `
                <span class="slot-empty-icon">+</span>
                <span class="slot-empty-text">Slot ${sIdx + 1}</span>
              `;
              slot.onclick = () => openPicker(buff.id, dIdx, sIdx);
            }

            slotsRow.appendChild(slot);
          });

          decksListDiv.appendChild(deckRow);
        });

        mainContainer.appendChild(groupCard);
      });
    }

    function removeCard(buffId, dIdx, sIdx) {
      allBuffDecks[buffId][dIdx][sIdx] = null;
      saveBuffDecks(buffId);
      renderAll();
    }

    function resetBuffGroup(buffId) {
      const buffObj = BUFF_BLOCKS.find(b => b.id === buffId);
      if (confirm(`Limpar os 6 decks do buff "${buffObj.name}"?`)) {
        allBuffDecks[buffId] = createEmptyDecks();
        saveBuffDecks(buffId);
        renderAll();
      }
    }

    function getUsedCardIds(buffId, excludeDeckIdx, excludeSlotIdx) {
      const used = new Set();
      allBuffDecks[buffId].forEach((deck, dIdx) => {
        deck.forEach((cardId, sIdx) => {
          if (cardId && !(dIdx === excludeDeckIdx && sIdx === excludeSlotIdx)) {
            used.add(cardId);
          }
        });
      });
      return used;
    }

    function openPicker(buffId, dIdx, sIdx) {
      currentSelecting = { buffId, deckIndex: dIdx, slotIndex: sIdx };
      renderAll();

      const buffObj = BUFF_BLOCKS.find(b => b.id === buffId);
      document.getElementById("modalPickerTitle").textContent = `${buffObj.name} | Deck #${dIdx + 1} (Carta ${sIdx + 1})`;

      const usedCards = getUsedCardIds(buffId, dIdx, sIdx);
      const modalBody = document.getElementById("modalBody");
      modalBody.innerHTML = "";

      const groups = [
        { key: "dano", title: "Dano (Atacantes / Aflição)", color: "#e74c3c" },
        { key: "buff", title: "Buff (Amplificação)", color: "#27ae60" },
        { key: "efeito", title: "Efeito Fixo", color: "#2980b9" },
        { key: "especifico", title: "Específico", color: "#576574" }
      ];

      groups.forEach(grp => {
        const cardsInGrp = CARDS.filter(c => c.role === grp.key);
        if (!cardsInGrp.length) return;

        const groupDiv = document.createElement("div");
        groupDiv.innerHTML = `
          <div class="modal-group-title" style="color: ${grp.color};">
            <span>●</span> ${grp.title}
          </div>
          <div class="modal-cards-grid"></div>
        `;

        const grid = groupDiv.querySelector(".modal-cards-grid");

        cardsInGrp.forEach(card => {
          const isUsed = usedCards.has(card.id);
          const item = document.createElement("div");
          item.className = `modal-card-item ${isUsed ? "disabled" : ""}`;
          item.title = isUsed ? `${card.name} (Em uso neste bloco)` : card.name;

          item.innerHTML = `<img src="${card.img}" alt="${card.name}" onerror="this.src='Cards/wc.png'">`;

          if (!isUsed) {
            item.onclick = () => selectCard(card.id);
          }

          grid.appendChild(item);
        });

        modalBody.appendChild(groupDiv);
      });

      document.getElementById("modalPicker").classList.add("open");
    }

    function selectCard(cardId) {
      if (!currentSelecting) return;
      const { buffId, deckIndex, slotIndex } = currentSelecting;
      allBuffDecks[buffId][deckIndex][slotIndex] = cardId;
      saveBuffDecks(buffId);
      closeModal();
      renderAll();
    }

    function closeModal() {
      document.getElementById("modalPicker").classList.remove("open");
      currentSelecting = null;
      renderAll();
    }

    document.getElementById("deckBaseLevel").addEventListener("input", () => {
      saveBaseLevel();
      renderAll();
    });

    document.getElementById("modalPicker").addEventListener("click", (e) => {
      if (e.target.id === "modalPicker") {
        closeModal();
      }
    });

    loadSavedData();
    renderAll();
  </script>
</body>
</html>
