<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Raid Ao Vivo - TT2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    h1, h2 { color: #ff9800; margin-bottom: 10px; }
    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 5px solid #ff9800;
      margin-bottom: 20px;
    }
    .status-ao-vivo {
      background: #2e7d32;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .grade {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .caixa {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }
    th { background-color: #252525; color: #ff9800; }
    .dano { color: #4caf50; font-weight: bold; }
    .cartas { color: #90caf9; font-size: 13px; }
    .evento-item {
      padding: 10px;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-right: 6px;
      background: #333;
      color: #ff9800;
    }
  </style>
</head>
<body>

  <div class="topo">
    <div>
      <h1 id="nome-cla" style="margin:0;">Carregando Clã...</h1>
      <small id="ultima-atualizacao">Conectando ao Cofre...</small>
    </div>
    <div class="status-ao-vivo">● Monitoramento 24h Ativo</div>
  </div>

  <div class="grade">
    <!-- Coluna da Esquerda: Ataques e Dano -->
    <div class="caixa">
      <h2>Últimos Ataques na Raid</h2>
      <table>
        <thead>
          <tr>
            <th>Horário</th>
            <th>Jogador</th>
            <th>Titã</th>
            <th>Dano Total</th>
            <th>Cartas Usadas</th>
          </tr>
        </thead>
        <tbody id="tabela-ataques">
          <tr><td colspan="5">Aguardando ataques da Raid...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Coluna da Direita: Avisos em Tempo Real (Alvos, Ciclos, Início) -->
    <div class="caixa">
      <h2>Radar de Eventos da Raid</h2>
      <div id="lista-eventos">Carregando histórico...</div>
    </div>
  </div>

  <script>
    // 1. Configuração do seu Cofre Supabase
    const SUPABASE_URL = "https://hqhirsnowapylfwhvduf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxaGlyc25vd2FweWxmd2h2ZHVmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjkzNTkxOCwiZXhwIjoyMTA4NTExOTE4fQ.sAZeXN1XFKDh0gVGBomanuHM6GkcEto8AmxZzNRehpI"; 
    const cofre = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Funções simples para extrair os dados do pacote da GameHive
    function formatarNumero(num) {
      return Number(num || 0).toLocaleString("pt-BR");
    }

    function calcularDanoTotal(dados) {
      // Se já vier o total direto ou se vier separado por partes do corpo (damage_log)
      if (dados.total_damage) return dados.total_damage;
      if (Array.isArray(dados.damage_log)) {
        return dados.damage_log.reduce((soma, item) => soma + Number(item.damage || item.value || 0), 0);
      }
      return 0;
    }

    function lerCartasUsadas(dados) {
      const lista = dados.cards_level || dados.cards || [];
      if (!Array.isArray(lista) || lista.length === 0) return "-";
      return lista.map(c => `${c.id || c.card || c} (Nv.${c.level || c.value || "?"})`).join(", ");
    }

    async function carregarPainel() {
      // Busca o nome do Clã na ficha geral
      const { data: ficha } = await cofre.from("dados_cla").select("*").eq("id", 1).single();
      if (ficha && ficha.dados) {
        console.log("Conteúdo salvo na ficha do clã:", ficha.dados);
        const d = Array.isArray(ficha.dados) ? ficha.dados[0] : (ficha.dados.data || ficha.dados);
        const nomeCla = d.clan_name || d.name || "Clã Conectado";
        const codigoCla = d.clan_code || d.code || (d.message ? d.message : "Aguardando dados");

        document.getElementById("nome-cla").innerText = `${nomeCla} (${codigoCla})`;
        document.getElementById("ultima-atualizacao").innerText = 
          "Ficha sincronizada em: " + new Date(ficha.atualizado_em).toLocaleString("pt-BR");
      }

      // Busca os últimos 50 eventos gravados pela Ponte
      const { data: eventos } = await cofre
        .from("eventos_raid")
        .select("*")
        .order("criado_em", { ascending: false })
        .limit(50);

      if (!eventos || eventos.length === 0) {
        document.getElementById("lista-eventos").innerHTML = 
          "<p>Nenhum evento aconteceu ainda desde que o robô ligou. Assim que alguém atacar ou mudar um alvo na Raid, aparecerá aqui!</p>";
        return;
      }

      // Separa o que é ataque concluído ("attack") do restante dos avisos
      const ataques = eventos.filter(e => e.tipo_evento === "attack");
      const tabela = document.getElementById("tabela-ataques");

      if (ataques.length > 0) {
        tabela.innerHTML = ataques.map(item => {
          const d = item.dados || {};
          const jogador = d.player?.name || d.player_name || d.name || "Membro";
          const tita = d.titan?.enemy_name || d.enemy_name || d.enemy_id || "Titã";
          const dano = formatarNumero(calcularDanoTotal(d));
          const cartas = lerCartasUsadas(d);
          const hora = new Date(item.criado_em).toLocaleTimeString("pt-BR");

          return `
            <tr>
              <td>${hora}</td>
              <td><strong>${jogador}</strong></td>
              <td>${tita}</td>
              <td class="dano">${dano}</td>
              <td class="cartas">${cartas}</td>
            </tr>
          `;
        }).join("");
      }

      // Preenche o radar lateral com todos os avisos (start_attack, target, start, cycle_reset)
      const radar = document.getElementById("lista-eventos");
      radar.innerHTML = eventos.slice(0, 15).map(item => {
        const hora = new Date(item.criado_em).toLocaleTimeString("pt-BR");
        const nomeJogador = item.dados?.player?.name || item.dados?.name || "";
        return `
          <div class="evento-item">
            <span class="tag">${item.tipo_evento.toUpperCase()}</span>
            <strong>${hora}</strong> ${nomeJogador ? "- " + nomeJogador : ""}
          </div>
        `;
      }).join("");
    }

    // Carrega os dados assim que abre a página
    carregarPainel();

    // Escuta em tempo real: atualiza a tela sozinho no segundo em que um ataque novo cair no Cofre!
    cofre
      .channel("atualizacao-ao-vivo")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "eventos_raid" }, () => {
        carregarPainel();
      })
      .subscribe();
  </script>
</body>
</html>
